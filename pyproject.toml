[project]
name = "mystery-agents"
version = "0.12.0"
description = "AI-powered mystery party game generator using LangGraph and LangChain"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Juanje Ojeda", email = "juanje.ojeda@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.20",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "pydantic>=2.14.3",
    "click>=8.5.1",
    "weasyprint>=70.0",
    "markdown>=3.11.3",
    "pillow>=13.0.0",
    "aiohttp>=3.14.5",
    "pyyaml>=6.0.3",
    "babel>=2.18.0",
    "python-dotenv>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
mystery-agents = "mystery_agents.cli:generate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "markdown.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_google_genai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_ollama: marks tests that require Ollama to be running",
    "requires_gemini: marks tests that require Google Gemini API key",
]
filterwarnings = [
    "ignore::UserWarning:weasyprint.*",
    "ignore:instantiateVariableFont.*:UserWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-PyYAML>=6.0.0",
]

